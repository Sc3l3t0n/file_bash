name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Without a version, setup-zig uses minimum_zig_version from build.zig.zon.
      - uses: mlugg/setup-zig@v2
        with:
          use-cache: false
      - run: zig fmt --check build.zig build.zig.zon src test

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The test suite takes a few minutes; a hung test fails the job instead of running for hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
      - run: zig build check
      - run: zig build test --summary all
